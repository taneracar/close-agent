[project]
name = "close-agent"
version = "0.1.0"
description = "Month-end close agent on Claude tool use, with a code-graded eval set"
requires-python = ">=3.12"
dependencies = ["anthropic>=2.12", "pydantic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
